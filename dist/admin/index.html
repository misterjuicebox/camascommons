<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Camas Commons Content Admin</title><!-- Explicitly set the CMS config URL so Decap CMS never gets a 404 regardless of trailing slash --><link href="/admin/config.yml" type="text/yaml" rel="cms-config-url"><link rel="stylesheet" href="/_astro/admin.BvYMkfFE.css"></head> <body>  <!-- Sticky Top Deployment Progress Bar --> <div id="deploy-top-bar"> <div class="top-bar-content"> <div class="top-bar-left"> <span id="deploy-top-icon">🚀</span> <span id="deploy-top-msg">Publishing changes to Cloudflare Pages...</span> <div class="top-bar-track"> <div id="deploy-top-fill" class="top-bar-fill"></div> </div> <span id="deploy-top-percent" style="min-width: 38px; color: #A3B8A8;">0%</span> </div> <div class="top-bar-right"> <a id="deploy-top-view-btn" href="https://camascommons.org" target="_blank" rel="noopener" class="top-bar-view-btn">
View Live Site ↗
</a> <button class="top-bar-close-btn" onclick="document.getElementById('deploy-top-bar').classList.remove('active')">✕</button> </div> </div> </div> <!-- Netlify / Decap CMS Script --> <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script> <script>
      var initialDataHash = null;

      // Capture pre-save baseline data hash from live site
      function updateBaselineHash() {
        fetch('https://camascommons.org/site-data.json?t=' + Date.now())
          .then(function(r) { return r.text(); })
          .then(function(t) { initialDataHash = t; })
          .catch(function() {});
      }
      updateBaselineHash();

      if (window.CMS) {
        if (window.createReactClass && window.h) {
          var PreviewPlaceholder = window.createReactClass({
            render: function() {
              return window.h('div', { style: { padding: '24px', color: '#666', fontFamily: 'sans-serif' } }, 'Camas Commons Editor Active');
            }
          });
          window.CMS.registerPreviewTemplate("content", PreviewPlaceholder);
          window.CMS.registerPreviewTemplate("fundraiser", PreviewPlaceholder);
          window.CMS.registerPreviewTemplate("faqs", PreviewPlaceholder);
        }

        // Listen for postSave / publish events in Decap CMS
        window.CMS.registerEventListener({
          name: 'postSave',
          handler: function() {
            startLiveVerification();
          }
        });
      }

      function startLiveVerification() {
        var topBar = document.getElementById('deploy-top-bar');
        var fill = document.getElementById('deploy-top-fill');
        var percent = document.getElementById('deploy-top-percent');
        var msg = document.getElementById('deploy-top-msg');
        var icon = document.getElementById('deploy-top-icon');
        var viewBtn = document.getElementById('deploy-top-view-btn');

        if (!topBar) return;

        // Reset UI state
        topBar.classList.add('active');
        fill.style.width = '10%';
        fill.style.background = '#C5746D';
        percent.textContent = '10%';
        icon.textContent = '🚀';
        msg.textContent = 'Publishing commit to Cloudflare Pages...';
        viewBtn.style.display = 'none';

        var startTime = Date.now();
        var currentPct = 10;

        // Smooth progress animation while Cloudflare is building
        var progressInterval = setInterval(function() {
          if (currentPct < 94) {
            currentPct += 1;
            fill.style.width = currentPct + '%';
            percent.textContent = currentPct + '%';
          }
        }, 600);

        function markComplete() {
          clearInterval(progressInterval);
          clearInterval(pollInterval);

          fill.style.width = '100%';
          fill.style.background = '#4CAF50';
          percent.textContent = '100%';
          icon.textContent = '✅';
          msg.textContent = 'Verified Live on Cloudflare Pages!';
          viewBtn.style.display = 'inline-flex';
        }

        // Poll Cloudflare API via Worker proxy every 2.5 seconds
        var pollInterval = setInterval(function() {
          var elapsedSec = Math.round((Date.now() - startTime) / 1000);

          fetch('https://camascommons-cms-oauth.bootsyeppesen.workers.dev/deploy-status?t=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.success && data.result && data.result.length > 0) {
                // Find deployment created AFTER user clicked Publish (subtract 12s for clock tolerance)
                var newDeploy = data.result.find(function(dep) {
                  var createdMs = new Date(dep.created_on).getTime();
                  return createdMs >= (startTime - 12000);
                });

                if (newDeploy) {
                  var stageName = (newDeploy.latest_stage && newDeploy.latest_stage.name) || '';
                  var status = (newDeploy.latest_stage && newDeploy.latest_stage.status) || newDeploy.status;

                  console.log('New Cloudflare Deployment Stage/Status:', stageName, status);

                  if (status === 'success' || (stageName === 'deploy' && status === 'success')) {
                    markComplete();
                  } else if (status === 'failure') {
                    clearInterval(progressInterval);
                    clearInterval(pollInterval);
                    msg.textContent = 'Build failed on Cloudflare';
                    fill.style.background = '#E53935';
                  } else {
                    msg.textContent = 'Cloudflare Pages: Building (' + (stageName || 'active') + ')...';
                  }
                } else {
                  // New build hasn't registered in API yet (first 5-10s)
                  msg.textContent = 'Cloudflare Pages: Triggering build runner (' + elapsedSec + 's)...';
                }
              } else if (elapsedSec >= 45) {
                markComplete();
              }
            })
            .catch(function(err) {
              console.log('Polling Cloudflare API...', err);
              if (elapsedSec >= 45) {
                markComplete();
              }
            });
        }, 2500);
      }
      function getUserToken() {
        try {
          var user = localStorage.getItem('netlify-cms-user') || localStorage.getItem('decap-cms-user');
          if (user) {
            var userData = JSON.parse(user);
            if (userData && userData.token) return userData.token;
            if (userData && userData.user && userData.user.token) return userData.user.token;
          }
        } catch (e) {}
        return null;
      }

      function mountAuthenticatedUI() {
        var token = getUserToken();
        var existingContainer = document.querySelector('.fab-container');

        if (!token) {
          if (existingContainer) existingContainer.remove();
          var m1 = document.getElementById('agent-request-modal');
          if (m1) m1.remove();
          var m2 = document.getElementById('analytics-modal');
          if (m2) m2.remove();
          return;
        }

        if (existingContainer) return; // Already mounted

        // 1. Mount FAB buttons
        var fabDiv = document.createElement('div');
        fabDiv.className = 'fab-container authenticated';
        fabDiv.innerHTML = `
          <button id="analytics-fab" onclick="openAnalyticsModal()">📊 Site Analytics</button>
          <button id="agent-request-fab" onclick="openAgentRequestModal()">🤖 Request AI Change</button>
        `;
        document.body.appendChild(fabDiv);

        // 2. Mount Request Modal
        var reqModal = document.createElement('div');
        reqModal.id = 'agent-request-modal';
        reqModal.className = 'analytics-backdrop';
        reqModal.innerHTML = `
          <div class="analytics-card" style="max-width: 560px;">
            <div class="analytics-card-header">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 1.5rem;">🤖</span>
                <div>
                  <h2 style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #1C2A20;">Request AI Agent Change</h2>
                  <p style="margin: 2px 0 0 0; font-size: 0.82rem; color: #566459;">Changes will be built and previewed on dev.camascommons.org</p>
                </div>
              </div>
              <button class="analytics-close" onclick="closeAgentRequestModal()">✕</button>
            </div>
            <form id="agent-request-form" onsubmit="handleAgentRequestSubmit(event)">
              <div style="display:none;" aria-hidden="true">
                <input type="text" name="website_url" tabindex="-1" autocomplete="off" />
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                  <label for="req-name">Your Name</label>
                  <input type="text" id="req-name" name="clientName" placeholder="e.g. Ally or Guise" required />
                </div>
                <div class="form-group">
                  <label for="req-email">Your Email</label>
                  <input type="email" id="req-email" name="clientEmail" placeholder="e.g. ally@camascommons.org" required />
                </div>
              </div>
              <div class="form-group">
                <label for="req-target">Target Page / Section</label>
                <select id="req-target" name="affectedPage">
                  <option value="Homepage / Main">Homepage / Main Site</option>
                  <option value="Header & Navbar">Header & Navigation Menu</option>
                  <option value="Footer">Footer & Social Links</option>
                  <option value="FAQs Section">FAQs & Questions</option>
                  <option value="Fundraiser Tracker">Fundraiser Tracker / Thermometer</option>
                  <option value="New Page / Layout">New Custom Page or Layout</option>
                </select>
              </div>
              <div class="form-group">
                <label for="req-title">Summary / Request Title</label>
                <input type="text" id="req-title" name="requestTitle" placeholder="e.g. Add newsletter signup block to footer" required />
              </div>
              <div class="form-group">
                <label for="req-desc">Detailed Description</label>
                <textarea id="req-desc" name="requestDescription" placeholder="Describe the exact changes, text, colors, or new elements you'd like the AI Agent to build..." required></textarea>
              </div>
              <button type="submit" id="req-submit-btn" class="submit-request-btn">🚀 Submit Request to AI Agent</button>
              <div id="req-status-msg" style="margin-top: 14px; font-size: 0.88rem; font-weight: 600; text-align: center; display: none;"></div>
            </form>
          </div>
        `;
        document.body.appendChild(reqModal);

        // 3. Mount Analytics Modal
        var analyticsModal = document.createElement('div');
        analyticsModal.id = 'analytics-modal';
        analyticsModal.className = 'analytics-backdrop';
        analyticsModal.innerHTML = `
          <div class="analytics-card">
            <div class="analytics-card-header">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 1.4rem;">📊</span>
                <div>
                  <h2 style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #1C2A20;">Camas Commons Traffic Analytics</h2>
                  <p style="margin: 2px 0 0 0; font-size: 0.82rem; color: #566459;">Real-time Cloudflare Web Insights</p>
                </div>
              </div>
              <button class="analytics-close" onclick="closeAnalyticsModal()">✕</button>
            </div>
            <div class="analytics-controls">
              <label style="font-size: 0.85rem; font-weight: 600; color: #24472F;">Timeframe:</label>
              <select id="analytics-days-select" onchange="fetchAnalyticsData(this.value)">
                <option value="1" selected>Last 24 Hours</option>
                <option value="7">Last 7 Days</option>
                <option value="30">Last 30 Days</option>
              </select>
            </div>
            <div id="analytics-body" class="analytics-body-grid">
              <div class="stat-box">
                <span class="stat-number" id="stat-pageviews">—</span>
                <span class="stat-label">Total Visits & Pageviews</span>
              </div>
              <div class="stat-box">
                <span class="stat-number" id="stat-referrers-count">—</span>
                <span class="stat-label">Traffic Sources</span>
              </div>
              <div class="analytics-list-box">
                <h4>🔗 Top Referrers (Traffic Sources)</h4>
                <ul id="analytics-referrers-list" class="analytics-data-list"><li>Loading...</li></ul>
              </div>
              <div class="analytics-list-box">
                <h4>📄 Top Pages Visited</h4>
                <ul id="analytics-pages-list" class="analytics-data-list"><li>Loading...</li></ul>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(analyticsModal);
      }

      function openAnalyticsModal() {
        var modal = document.getElementById('analytics-modal');
        if (modal) {
          modal.classList.add('active');
          var days = document.getElementById('analytics-days-select').value || 1;
          fetchAnalyticsData(days);
        }
      }

      function closeAnalyticsModal() {
        var modal = document.getElementById('analytics-modal');
        if (modal) {
          modal.classList.remove('active');
        }
      }

      function fetchAnalyticsData(days) {
        var token = getUserToken();
        var pageviewsEl = document.getElementById('stat-pageviews');
        var referrersCountEl = document.getElementById('stat-referrers-count');
        var referrersListEl = document.getElementById('analytics-referrers-list');
        var pagesListEl = document.getElementById('analytics-pages-list');

        if (!pageviewsEl || !token) return;

        pageviewsEl.textContent = '...';
        referrersCountEl.textContent = '...';
        referrersListEl.innerHTML = '<li>Loading...</li>';
        pagesListEl.innerHTML = '<li>Loading...</li>';

        fetch('https://camascommons-cms-oauth.bootsyeppesen.workers.dev/analytics?days=' + days, {
          headers: {
            'Authorization': 'Bearer ' + token
          }
        })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data && data.success) {
              pageviewsEl.textContent = data.totalPageviews || '0';
              referrersCountEl.textContent = data.referrers ? data.referrers.length : '0';

              if (data.referrers && data.referrers.length > 0) {
                referrersListEl.innerHTML = data.referrers.map(function(item) {
                  return '<li><span>' + item.name + '</span> <strong>' + item.count + '</strong></li>';
                }).join('');
              } else {
                referrersListEl.innerHTML = '<li><span>Direct / None</span> <strong>Active</strong></li>';
              }

              if (data.pages && data.pages.length > 0) {
                pagesListEl.innerHTML = data.pages.map(function(item) {
                  return '<li><span>' + item.path + '</span> <strong>' + item.count + '</strong></li>';
                }).join('');
              } else {
                pagesListEl.innerHTML = '<li><span>/ (Homepage)</span> <strong>Active</strong></li>';
              }
            } else {
              pageviewsEl.textContent = 'Live';
              referrersCountEl.textContent = 'Active';
              referrersListEl.innerHTML = '<li><span>Direct / Social Visits</span> <strong>Active</strong></li>';
              pagesListEl.innerHTML = '<li><span>/ (Homepage)</span> <strong>Active</strong></li>';
            }
          })
          .catch(function(err) {
            console.log('Analytics Error:', err);
            pageviewsEl.textContent = 'Live';
            referrersCountEl.textContent = 'Active';
            referrersListEl.innerHTML = '<li><span>Direct / Social Visits</span> <strong>Active</strong></li>';
            pagesListEl.innerHTML = '<li><span>/ (Homepage)</span> <strong>Active</strong></li>';
          });
      }

      function openAgentRequestModal() {
        var modal = document.getElementById('agent-request-modal');
        if (modal) {
          modal.classList.add('active');
        }
      }

      function closeAgentRequestModal() {
        var modal = document.getElementById('agent-request-modal');
        if (modal) {
          modal.classList.remove('active');
        }
      }

      function handleAgentRequestSubmit(e) {
        e.preventDefault();
        var token = getUserToken();
        var form = document.getElementById('agent-request-form');
        var submitBtn = document.getElementById('req-submit-btn');
        var statusMsg = document.getElementById('req-status-msg');

        if (!form || !submitBtn || !statusMsg) return;

        if (!token) {
          statusMsg.style.display = 'block';
          statusMsg.style.color = '#C5746D';
          statusMsg.textContent = '❌ Authentication error: Please log into the CMS to submit requests.';
          return;
        }

        var formData = new FormData(form);
        var payload = Object.fromEntries(formData.entries());

        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Sending request to AI Agent...';
        statusMsg.style.display = 'none';

        fetch('/api/request-change', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(payload)
        })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 Submit Request to AI Agent';

            statusMsg.style.display = 'block';

            if (data && data.success) {
              statusMsg.style.color = '#24472F';
              var issueText = data.issueNumber ? ' Task Issue #' + data.issueNumber + ' created!' : '';
              statusMsg.innerHTML = '✅ Request received!' + issueText + '<br/><span style="font-weight:400; font-size:0.82rem;">The AI Agent will apply your changes to <a href="https://dev.camascommons.org" target="_blank" style="color:#C5746D; font-weight:700;">dev.camascommons.org</a> shortly.</span>';
              form.reset();
            } else {
              statusMsg.style.color = '#C5746D';
              statusMsg.textContent = '❌ ' + (data.error || 'Failed to submit request. Please try again.');
            }
          })
          .catch(function(err) {
            console.error('Request submission error:', err);
            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 Submit Request to AI Agent';
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#C5746D';
            statusMsg.textContent = '❌ Connection error. Please try again later.';
          });
      }

      setInterval(mountAuthenticatedUI, 800);
    </script> </body> </html>

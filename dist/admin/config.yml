backend:
  name: github
  repo: misterjuicebox/camascommons
  branch: main
  base_url: https://camascommons-cms-oauth.bootsyeppesen.workers.dev
  auth_endpoint: /auth

media_folder: "public/images"
public_folder: "/images"

editor:
  preview: false

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "src/content/fundraiser/site-data.json"
        label: "Land Trust Content & Text"
        name: "fundraiser"
        editor:
          preview: false
        fields:
          - { label: "Site Title & Header", name: "siteTitle", widget: "string" }
          - { label: "Tagline / Subtitle", name: "tagline", widget: "string" }
          - { label: "SMS / Social Preview Title (og:title)", name: "ogTitle", widget: "string", required: false }
          - { label: "SMS / Social Preview Description (og:description)", name: "ogDescription", widget: "text", required: false }
          - { label: "SMS / Social Preview Image (og:image)", name: "ogImage", widget: "image", required: false }
          - label: "Homepage Sections (Add, Edit, Re-order Any Section)"
            name: "sections"
            widget: "list"
            hint: "💡 FORMATTING TIPS: 1) BOLD TEXT: Wrap words in **double asterisks** (e.g. **bold text**). 2) FLOWER BULLETS: Start lines with ~ or - or * (e.g. ~ Bullet item), or type :flower: inline anywhere."
            types:
              - label: "Welcome Message & Main Photo"
                name: "welcome_block"
                widget: "object"
                fields:
                  - { label: "Welcome Message (Ally & Guisepi)", name: "welcomeText", widget: "text", default: "", required: false, hint: "💡 Use **text** for bold text." }
                  - { label: "Signature Note", name: "signature", widget: "string", default: "— Ally & Guisepi", required: false }
                  - { label: "Section Photo", name: "image", widget: "image", default: "/images/Main.jpeg", required: false }
                  - { label: "Make Photo Clickable (Click to view full-size)", name: "clickableImage", widget: "boolean", default: true, required: false }
              - label: "Custom Content Section"
                name: "custom_section"
                widget: "object"
                fields:
                  - { label: "Section Title (Optional)", name: "title", widget: "string", default: "", required: false }
                  - { label: "Content Paragraphs (Optional)", name: "content", widget: "text", default: "", required: false, hint: "💡 TIP: Use **text** for bold text. Start lines with ~ or - or * for Camas Flower Bullets." }
                  - { label: "Camas Flower Bullet Points (One per line - Optional)", name: "bulletPoints", widget: "text", required: false }
                  - { label: "Section Photo", name: "image", widget: "image", default: "", required: false }
                  - { label: "Make Photo Clickable (Click to view full-size)", name: "clickableImage", widget: "boolean", default: true, required: false }
                  - { label: "Section Style / Layout", name: "style", widget: "select", default: "story", options: [
                      { label: "Standard Story Section", value: "story" },
                      { label: "Highlighted Callout Box (with Pledge Button)", value: "callout" }
                    ] }
              - label: "FAQ Accordion Section"
                name: "faq_block"
                widget: "object"
                fields:
                  - { label: "Section Title", name: "title", widget: "string", default: "FAQ:", required: false }
                  - { label: "Section Header Photo", name: "image", widget: "image", default: "/images/babygoats.jpeg", required: false }
                  - { label: "Make Section Photo Clickable", name: "clickableImage", widget: "boolean", default: true, required: false }
                  - { label: "FAQ Questions & Answers (Drag = handles to re-order)", name: "items", widget: "list", required: false, fields: [
                      { label: "Question", name: "q", widget: "string", default: "", required: false },
                      { label: "Answer Paragraphs", name: "a", widget: "text", default: "", required: false },
                      { label: "FAQ Photo", name: "image", widget: "image", default: "", required: false },
                      { label: "Make Photo Clickable", name: "clickableImage", widget: "boolean", default: true, required: false }
                    ] }
                  - { label: "Volunteer Skill Needs (One per line)", name: "volunteerSkills", widget: "text", required: false }
              - label: "Photo Gallery Slideshow"
                name: "slideshow_block"
                widget: "object"
                fields:
                  - { label: "Section Title (Optional)", name: "title", widget: "string", default: "", required: false }
                  - { label: "Section Header Photo (Optional)", name: "image", widget: "image", default: "", required: false }
                  - { label: "Make Photo Clickable (Click to view full-size)", name: "clickableImage", widget: "boolean", default: true, required: false }
              - label: "Advisory Board & Team Section"
                name: "advisory_block"
                widget: "object"
                fields:
                  - { label: "Section Title", name: "title", widget: "string", default: "Advisory Board & Team", required: false }
                  - { label: "Advisory Members (Drag = handles to re-order)", name: "members", widget: "list", required: false, fields: [
                      { label: "Full Name", name: "name", widget: "string", default: "", required: false },
                      { label: "Title / Subtitle", name: "role", widget: "string", default: "Advisory Board Member", required: false },
                      { label: "Circle Headshot Photo", name: "image", widget: "image", default: "", required: false },
                      { label: "Make Photo Clickable", name: "clickableImage", widget: "boolean", default: true, required: false },
                      { label: "Summary / Bio Text", name: "bio", widget: "text", default: "", required: false }
                    ] }
              - label: "Pledge & Donate Section (Dual Buttons)"
                name: "pledge_donate_block"
                widget: "object"
                fields:
                  - { label: "Section Title", name: "title", widget: "string", default: "Support Camas Commons — Pledge or Donate", required: false }
                  - { label: "Introduction Text", name: "introText", widget: "text", default: "All donations will provide necessary financial support at the time of the submission deadline that will include:", required: false }
                  - { label: "Donation Impact Points (One per line)", name: "impactPoints", widget: "text", default: "Purchasing Power - it is very important that we raise as much funds as we can in this window in order to be considered seriously as a purchaser.\nStart Up Costs - leading up to the submission deadline\nIf Selected - donations will go to the purchase of the land & associated costs\nIf Not Selected - donations will stay in the public realm & go towards a similar project", required: false }
                  - { label: "Section Photo", name: "image", widget: "image", default: "/images/community.jpg", required: false }
                  - { label: "Pledge Definition Text", name: "pledgeText", widget: "text", default: "A pledge is a commitment to donate your specified pledge amount to Camas Commons upon the selection of the proposal by the San Juan County Conservation Land Bank.", required: false }
                  - { label: "Pledge Button Label", name: "pledgeButtonText", widget: "string", default: "MAKE A PLEDGE", required: false }
                  - { label: "Pledge Form URL", name: "pledgeUrl", widget: "string", default: "https://docs.google.com/forms/d/e/1FAIpQLSdUgYx-Of_IYXaSeiBC3FxrmvJOvT2jL292d3E1l6PLRHarSQ/viewform?usp=header", required: false }
                  - { label: "Donate Button Label", name: "donateButtonText", widget: "string", default: "DONATE NOW (PAYPAL)", required: false }
                  - { label: "Donate Form URL", name: "donateUrl", widget: "string", default: "https://www.paypal.com/donate/?hosted_button_id=RAKDSTT7ZDGKA", required: false }
                  - { label: "Additional Info & Mail-in Check Details", name: "additionalInfo", widget: "text", default: "We rely on these funds to be available at the time of purchase at the end of December 2026.\n\nTo donate via check, please mail to **On Sacred Ground Land Trust, PO Box 1732, Friday Harbor, WA 98250**. Specify **Camas Commons** in the notes.\n\nWe need as many pledges and donations as possible for the mid-September proposal deadline. This will convey that we have raised enough money to be a serious purchaser.\n\nPlease email questions to info@camascommons.org", required: false }
          - { label: "Contact Email", name: "contactEmail", widget: "string", required: false }

  - name: "faqs"
    label: "FAQs"
    folder: "src/content/faqs"
    create: true
    format: "json"
    identifier_field: "q"
    sortable_fields: ["order", "q"]
    editor:
      preview: false
    fields:
      - { label: "Order Number (for sorting)", name: "order", widget: "number", default: 10, value_type: "int" }
      - { label: "Question", name: "q", widget: "string", default: "", required: false }
      - { label: "Answer Paragraphs (Optional)", name: "a", widget: "text", default: "", required: false }
      - { label: "Optional Image (e.g. /images/hay.jpeg)", name: "image", widget: "string", default: "", required: false }
      - { label: "Make Photo Clickable (Click to view full-size)", name: "clickableImage", widget: "boolean", default: true, required: false }
